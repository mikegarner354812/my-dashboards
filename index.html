<title>Blues Theory Reference — Index</title>

<style>
  :root{
    --bg: #eef1ea;
    --bg-panel: #ffffff;
    --text: #1e2a24;
    --text-dim: #5b6b62;
    --text-faint: #93a099;
    --brass: #8a6a12;
    --brass-bright: #a9821c;
    --rule: #d9ddd3;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(138,106,18,0.06), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    padding: 48px 24px 80px;
  }

  .wrap{ max-width: 720px; margin: 0 auto; }

  header{
    padding-bottom:28px;
    margin-bottom:36px;
    border-bottom: 1px solid var(--rule);
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--brass);
    margin:0 0 10px;
    font-weight:600;
  }
  h1{

    font-optical-sizing:auto;
    font-weight:600;
    font-size:42px;
    line-height:1;
